<!DOCTYPE html>
<html lang="zh-Hant">
    <head>
        <title>youtubeRandomPlayer</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="referrer" content="strict-origin-when-cross-origin" />
        <meta name="theme-color" content="#0e1020">
        <!-- 讓載入畫面在 less 編譯完成前就能正確顯示，避免閃出未套用樣式的頁面 -->
        <style>
            html{background:#0e1020;}
            .loading-container{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;background:#0e1020;z-index:9999;transition:opacity .5s ease,visibility .5s;}
            .loading-container.hide{opacity:0;visibility:hidden;}
        </style>
        <link rel="stylesheet/less" type="text/css" href="./less/style.less" />
        <link rel="stylesheet/less" type="text/css" href="./less/sidebar.less" />
        <link rel="stylesheet/less" type="text/css" href="./less/loading-animation.css" />
    </head>
    <body>
        <div class="bg-layer" id="bg-layer-a"></div>
        <div class="bg-layer" id="bg-layer-b"></div>
        <div class="bg-shade"></div>
        <canvas id="canvas"></canvas>

        <div class="loading-container">
            <div class="dot-pulse">
                <div class="dot-pulse__dot"></div>
            </div>
        </div>

        <header class="topbar">
            <button class="toggle-btn icon-btn" type="button" title="Live2D 設定" aria-label="開啟 Live2D 設定">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
            <h1 class="brand">YouTube <span>Random Player</span></h1>
        </header>

        <main class="app">
            <section id="put-playlist" class="glass">
                <div class="listIdHistory">
                    <label for="listIdHistoryCollect">清單紀錄</label>
                    <div class="history-row">
                        <select name="listIdHistoryCollect" id="listIdHistoryCollect">
                            <option value="">null</option>
                        </select>
                        <button id="clearListIdHistory" class="ghost-btn" type="button">清除紀錄</button>
                    </div>
                </div>
                <div class="add-playlist-area">
                    <input id="playlist-url" type="text" placeholder="貼上 YouTube 播放清單網址或 ID" value="PLR3WiLknrVUZX033xFGw8ISMA_RdXUnNk">
                    <button id="search" class="primary-btn" type="button">
                        加入清單
                        <span id="load-img"><img src="./img/hutoa01-unscreen.gif" alt=""></span>
                    </button>
                </div>
            </section>

            <section class="glass player-card">
                <input type="checkbox" id="checkDisplayPlayer" checked="checked">
                <label for="checkDisplayPlayer" class="player-toggle">
                    <span class="switch"></span>顯示影片
                </label>
                <div id="player"></div>

                <div class="progress-area">
                    <span class="start-time">0:00</span>
                    <div class="progress-bar" role="progressbar" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100">
                        <div class="progress"></div>
                    </div>
                    <span class="end-time">0:00</span>
                </div>

                <div id="button-area">
                    <button id="random-btn" class="ctrl-btn" type="button" title="隨機排列">
                        <svg fill="currentColor" width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
                            <path d="M13 12h-2c-1 0-1.7-1.2-2.4-2.7-0.3 0.7-0.6 1.5-1 2.3 0.8 1.4 1.8 2.4 3.4 2.4h2v2l3-3-3-3v2z"></path>
                            <path d="M5.4 6.6c0.3-0.7 0.6-1.5 1-2.2-0.8-1.4-1.9-2.4-3.4-2.4h-3v2h3c1 0 1.7 1.2 2.4 2.6z"></path>
                            <path d="M16 3l-3-3v2h-2c-2.7 0-3.9 3-5 5.7-0.8 2.1-1.7 4.3-3 4.3h-3v2h3c2.6 0 3.8-2.8 4.9-5.6 0.9-2.2 1.8-4.4 3.1-4.4h2v2l3-3z"></path>
                        </svg>
                    </button>
                    <button id="prev-song" class="ctrl-btn" type="button" title="上一首 (W)">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
                    </button>
                    <button id="play" class="ctrl-btn" type="button" title="播放 / 暫停 (Space)">
                        <svg fill="currentColor" width="22" height="22" viewBox="0 0 24 24" style="display: none;" xmlns="http://www.w3.org/2000/svg">
                            <path d="M8 5.14v13.72a1 1 0 0 0 1.52.85l11.1-6.86a1 1 0 0 0 0-1.7L9.52 4.29A1 1 0 0 0 8 5.14z"/>
                        </svg>
                        <svg fill="currentColor" width="22" height="22" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <rect x="6" y="4.5" width="4" height="15" rx="1.2"/><rect x="14" y="4.5" width="4" height="15" rx="1.2"/>
                        </svg>
                    </button>
                    <button id="next-song" class="ctrl-btn" type="button" title="下一首 (S)">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
                    </button>
                    <button id="order" class="ctrl-btn" type="button" title="順序排列">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 7h16M4 17h16"/><path d="M17 4l3 3-3 3M17 14l3 3-3 3"/>
                        </svg>
                    </button>
                </div>
                <div class="sub-actions">
                    <button id="use-localStorage" class="ghost-btn" type="button" title="載入上次的清單與播放位置">
                        <svg fill="currentColor" width="14" height="14" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12,2A10,10,0,0,0,5.12,4.77V3a1,1,0,0,0-2,0V7.5a1,1,0,0,0,1,1H8.62a1,1,0,0,0,0-2H6.22A8,8,0,1,1,4,12a1,1,0,0,0-2,0A10,10,0,1,0,12,2Zm0,6a1,1,0,0,0-1,1v3a1,1,0,0,0,1,1h2a1,1,0,0,0,0-2H13V9A1,1,0,0,0,12,8Z"/>
                        </svg>
                        上次清單
                    </button>
                    <a id="download" class="ghost-btn" href="download-page.html" target="_blank">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
                        下載
                    </a>
                    <span class="kbd-hint">W/S 切歌 · A/D 快轉 · ↑↓ 音量 · Space 播放</span>
                </div>
            </section>

            <section id="select-area" class="glass">
                <div class="list-head">
                    <h2>播放清單</h2>
                    <div class="search-box">
                        <input id="search-list" type="text" name="search-list" value="" placeholder="搜尋影片">
                        <button id="search-list-btn" type="button" aria-label="搜尋">
                            <svg width="15" height="15" viewBox="0 0 17 17" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd"
                            d="M16.3451 15.2003C16.6377 15.4915 16.4752 15.772 16.1934 16.0632C16.15 16.1279 16.0958 16.1818 16.0525 16.2249C15.7707 16.473 15.4456 16.624 15.1854
                            16.3652L11.6848 12.8815C10.4709 13.8198 8.97529 14.3267 7.44714 14.3267C3.62134 14.3267 0.5 11.2314 0.5 7.41337C0.5 3.60616 3.6105 0.5 7.44714 0.5C11.2729 0.5 14.3943
                            3.59538 14.3943 7.41337C14.3943 8.98802 13.8524 10.5087 12.8661 11.7383L16.3451 15.2003ZM2.13647 7.4026C2.13647 10.3146 4.52083 12.6766 7.43624 12.6766C10.3517 12.6766
                            12.736 10.3146 12.736 7.4026C12.736 4.49058 10.3517 2.1286 7.43624 2.1286C4.50999 2.1286 2.13647 4.50136 2.13647 7.4026Z" fill="currentColor"></path></svg>
                        </button>
                    </div>
                </div>
                <select name="videoTitle" id="video-title" size="10"></select>
                <p class="list-empty">尚未載入播放清單，請先在上方加入清單。</p>
            </section>
        </main>

        <button id="prevImg" class="bg-nav" type="button" title="上一張背景" aria-label="上一張背景">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <button id="nextImg" class="bg-nav" type="button" title="下一張背景" aria-label="下一張背景">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
        </button>

        <div class="sidebar-mask toggle-btn"></div>
        <aside class="sidebar" aria-label="Live2D 設定">
            <div class="sidebar-head">
                <h2>Live2D 設定</h2>
                <button class="toggle-btn icon-btn" type="button" aria-label="關閉">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
                </button>
            </div>

            <section class="panel">
                <h3>模型</h3>
                <div class="model-select">
                    <button id="model-prev" class="icon-btn" type="button" title="上一個模型">‹</button>
                    <select name="models" id="models"></select>
                    <button id="model-next" class="icon-btn" type="button" title="下一個模型">›</button>
                </div>
                <div class="row">
                    <button id="model-random" class="ghost-btn" type="button">隨機換一個</button>
                    <span id="model-status" class="model-status"></span>
                </div>
                <label class="check"><input type="checkbox" id="l2d-random-start"><span class="switch"></span>每次開啟時隨機模型</label>
            </section>

            <section class="panel">
                <h3>外觀</h3>
                <div class="field">
                    <label for="size">大小 <output id="size-val">100%</output></label>
                    <input type="range" id="size" name="size" min="30" max="250" value="100">
                </div>
                <div class="field">
                    <label for="l2d-opacity">透明度 <output id="opacity-val">100%</output></label>
                    <input type="range" id="l2d-opacity" min="10" max="100" value="100">
                </div>
                <label class="check"><input type="checkbox" id="l2d-visible"><span class="switch"></span>顯示模型</label>
                <label class="check"><input type="checkbox" id="l2d-flip"><span class="switch"></span>左右翻轉</label>
                <label class="check"><input type="checkbox" id="l2d-shadow"><span class="switch"></span>柔和陰影</label>
                <label class="check"><input type="checkbox" id="l2d-follow"><span class="switch"></span>視線跟隨滑鼠</label>
            </section>

            <section class="panel">
                <h3>位置</h3>
                <label class="check"><input type="checkbox" name="dragable" id="dragable"><span class="switch"></span>調整模式（拖曳移動、滾輪縮放）</label>
                <div class="seg">
                    <button type="button" data-pos="0.2">靠左</button>
                    <button type="button" data-pos="0.5">置中</button>
                    <button type="button" data-pos="0.8">靠右</button>
                </div>
                <button id="l2d-reset" class="ghost-btn wide" type="button">重設位置與大小</button>
            </section>

            <section class="panel">
                <h3>動作</h3>
                <label class="check"><input type="checkbox" id="l2d-tap"><span class="switch"></span>點擊模型播放隨機動作</label>
                <div id="motion-list" class="motion-list"></div>
            </section>
        </aside>

        <div class="l2d-edit-hint">
            <span>調整模式：拖曳移動 · 滾輪縮放 · 雙擊重設</span>
            <button id="l2d-edit-done" type="button">完成</button>
        </div>

        <script src="./js/loadingPage.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/axios@1.7.7/dist/axios.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/less@4.2.0/dist/less.min.js"></script>
        <script src="./js/index.js"></script>
        <script src="./js/changeBackground.js"></script>
        <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.2/dist/browser/pixi.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js"></script>
        <script src="./js/checkDevice.js"></script>
        <script src="./js/toggleSidebar.js"></script>
    </body>
</html>
